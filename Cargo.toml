[package]
name = "sekka"
version = "0.2.0"
edition = "2021"
description = "Japanese kana-kanji conversion library implementing the Sekka input model"
license = "GPL-3.0-or-later"
authors = ["yuta <yusabo90002@gmail.com>"]
repository = "https://github.com/YuSabo90002/libsekka"
readme = "README.md"
keywords = ["japanese", "input-method", "sekka", "skk", "kana-kanji"]
categories = ["text-processing", "internationalization"]

[lib]
name = "sekka"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "sekka-dict-tool"
path = "bin/sekka-dict-tool.rs"

[dependencies]
sled = "0.34"
strsim = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
encoding_rs = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "conversion_bench"
harness = false

[features]
default = []
capi = []

[package.metadata.capi.header]
name = "sekka"
generation = true

[package.metadata.capi.library]
name = "sekka"
